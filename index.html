<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Repair</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(72, 49, 212, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(0, 183, 255, 0.10) 0%, transparent 60%),
                linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            padding: 20px;
        }

        /* ===== Card ===== */
        .maintenance-card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 48px;
            padding: 60px 50px 55px;
            text-align: center;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .maintenance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(120, 80, 255, 0.06) 0%, transparent 60%);
            pointer-events: none;
            animation: shimmer 8s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.5;
            }
            100% {
                transform: translate(10%, 10%) rotate(5deg);
                opacity: 1;
            }
        }

        /* ===== Icon ===== */
        .icon-wrapper {
            position: relative;
            z-index: 1;
            display: inline-block;
            margin-bottom: 32px;
        }

        .icon-ring {
            width: 110px;
            height: 110px;
            margin: 0 auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: pulse-ring 2.8s ease-in-out infinite;
        }

        .icon-ring svg {
            width: 52px;
            height: 52px;
            fill: none;
            stroke: #a78bfa;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 18px rgba(167, 139, 250, 0.25));
            transition: transform 0.6s ease;
        }

        .icon-ring:hover svg {
            transform: rotate(15deg) scale(1.05);
        }

        .icon-ring::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #a78bfa;
            box-shadow: 0 0 30px #a78bfa, 0 0 60px rgba(167, 139, 250, 0.3);
            animation: orbit-dot 3s linear infinite;
        }

        @keyframes orbit-dot {
            0% {
                transform: translateX(-50%) rotate(0deg) translateY(-50px) rotate(0deg);
            }
            100% {
                transform: translateX(-50%) rotate(360deg) translateY(-50px) rotate(-360deg);
            }
        }

        @keyframes pulse-ring {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.10);
            }
            50% {
                box-shadow: 0 0 0 20px rgba(167, 139, 250, 0.02);
            }
        }

        /* ===== Title ===== */
        .title {
            position: relative;
            z-index: 1;
            font-size: clamp(2rem, 6vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 14px;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.3);
        }

        .title .highlight {
            background: linear-gradient(135deg, #a78bfa, #818cf8, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== Status badge ===== */
        .sub-status {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(167, 139, 250, 0.10);
            border: 1px solid rgba(167, 139, 250, 0.15);
            border-radius: 100px;
            padding: 8px 22px 8px 18px;
            margin-bottom: 28px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #c4b5fd;
            letter-spacing: 0.4px;
            backdrop-filter: blur(4px);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #34d399;
            animation: blink-dot 1.6s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
        }

        @keyframes blink-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* ===== Description ===== */
        .description {
            position: relative;
            z-index: 1;
            font-size: clamp(1rem, 1.6vw, 1.2rem);
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto 38px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ===== Progress ===== */
        .progress-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 auto 38px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: linear-gradient(90deg, #a78bfa, #818cf8, #60a5fa);
            animation: progress-load 3.8s ease-in-out infinite alternate;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.25);
        }

        @keyframes progress-load {
            0% {
                width: 8%;
            }
            50% {
                width: 72%;
            }
            100% {
                width: 92%;
            }
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.75rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.5px;
        }

        .progress-label span:last-child {
            color: rgba(167, 139, 250, 0.5);
        }

        /* ===== Footer ===== */
        .footer-meta {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 14px 28px;
            margin-top: 6px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.3px;
        }

        .footer-meta a {
            color: rgba(167, 139, 250, 0.4);
            text-decoration: none;
            transition: color 0.3s ease;
            border-bottom: 1px dotted transparent;
        }

        .footer-meta a:hover {
            color: #a78bfa;
            border-bottom-color: rgba(167, 139, 250, 0.25);
        }

        .divider-dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
        }

        /* ===== Responsive ===== */
        @media (max-width: 520px) {
            .maintenance-card {
                padding: 40px 24px 35px;
                border-radius: 32px;
            }
            .icon-ring {
                width: 80px;
                height: 80px;
            }
            .icon-ring svg {
                width: 38px;
                height: 38px;
            }
            .icon-ring::after {
                width: 8px;
                height: 8px;
                top: -4px;
            }
            .sub-status {
                font-size: 0.75rem;
                padding: 6px 16px 6px 14px;
            }
            .footer-meta {
                flex-direction: column;
                gap: 6px;
            }
            .divider-dot {
                display: none;
            }
        }

        @media (max-width: 380px) {
            .maintenance-card {
                padding: 28px 16px 28px;
                border-radius: 24px;
            }
            .title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <div class="maintenance-card">

        <!-- Icon -->
        <div class="icon-wrapper">
            <div class="icon-ring">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </div>
        </div>

        <!-- Title -->
        <h1 class="title">
            <span class="highlight">This website</span> is under repair
        </h1>

        <!-- Status badge -->
        <div class="sub-status">
            <span class="status-dot"></span>
            <span>Under maintenance · Back soon</span>
        </div>

        <!-- Description -->
        <p class="description">
            We are currently performing essential upgrades and optimizations to enhance your experience.<br />
            Thank you for your patience.
        </p>

        <!-- Progress -->
        <div class="progress-wrapper">
            <div class="progress-track">
                <div class="progress-bar"></div>
            </div>
            <div class="progress-label">
                <span>Repair in progress</span>
                <span>Expected completion shortly</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-meta">
            <span>© 2026</span>
            <span class="divider-dot"></span>
            <a href="#" onclick="return false;">Contact support</a>
            <span class="divider-dot"></span>
            <span>Estimated downtime: <span style="color:rgba(255,255,255,0.3);">…</span></span>
        </div>

    </div>

</body>
</html>
